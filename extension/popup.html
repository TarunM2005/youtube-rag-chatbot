<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 480px;
      height: 600px;
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
    }

    #history {
      width: 140px;
      border-right: 1px solid #334155;
      overflow-y: auto;
      padding: 5px;
    }

    .history-item {
      font-size: 12px;
      padding: 6px;
      margin-bottom: 4px;
      background: #1e293b;
      border-radius: 5px;
      cursor: pointer;
    }

    .history-item:hover {
      background: #334155;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px;
      background: #1e293b;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      margin: 6px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 80%;
    }

    .user {
      background: #2563eb;
      align-self: flex-end;
    }

    .bot {
      background: #334155;
    }

    #inputArea {
      display: flex;
      padding: 5px;
      gap: 5px;
      border-top: 1px solid #334155;
    }

    textarea {
      flex: 1;
      border-radius: 6px;
      padding: 6px;
      border: none;
      outline: none;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    #clear {
      background: #ef4444;
    }
  </style>
</head>

<body>

<div id="history"></div>

<div id="main">

  <header>🤖 YouTube AI Assistant</header>

  <div id="chat"></div>

  <div id="inputArea">
    <textarea id="question" placeholder="Ask something..."></textarea>
    <button id="ask">➤</button>
  </div>

  <button id="clear">Clear</button>

</div>

<script src="popup.js"></script>

</body>
</html>
